<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">Como converter px em rem (raiz de 16px)</text>

  <rect x="30" y="70" width="840" height="260" rx="14" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
  <text x="120" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">px</text>
  <text x="330" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Cálculo</text>
  <text x="560" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">rem</text>
  <text x="760" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Resultado</text>
  <line x1="50" y1="124" x2="850" y2="124" stroke="#999"/>

  <text x="120" y="160" text-anchor="middle" font-size="18" fill="#222">8px</text>
  <text x="330" y="160" text-anchor="middle" font-size="16" fill="#555">8 ÷ 16</text>
  <text x="560" y="160" text-anchor="middle" font-size="18" fill="#2e7d32">0.5rem</text>
  <text x="760" y="160" text-anchor="middle" font-size="16" fill="#555">= 8px</text>

  <text x="120" y="196" text-anchor="middle" font-size="18" fill="#222">16px</text>
  <text x="330" y="196" text-anchor="middle" font-size="16" fill="#555">16 ÷ 16</text>
  <text x="560" y="196" text-anchor="middle" font-size="18" fill="#2e7d32">1rem</text>
  <text x="760" y="196" text-anchor="middle" font-size="16" fill="#555">= 16px</text>

  <text x="120" y="232" text-anchor="middle" font-size="18" fill="#222">24px</text>
  <text x="330" y="232" text-anchor="middle" font-size="16" fill="#555">24 ÷ 16</text>
  <text x="560" y="232" text-anchor="middle" font-size="18" fill="#2e7d32">1.5rem</text>
  <text x="760" y="232" text-anchor="middle" font-size="16" fill="#555">= 24px</text>

  <text x="120" y="268" text-anchor="middle" font-size="18" fill="#222">32px</text>
  <text x="330" y="268" text-anchor="middle" font-size="16" fill="#555">32 ÷ 16</text>
  <text x="560" y="268" text-anchor="middle" font-size="18" fill="#2e7d32">2rem</text>
  <text x="760" y="268" text-anchor="middle" font-size="16" fill="#555">= 32px</text>

  <text x="450" y="368" text-anchor="middle" font-size="15" fill="#444">Regra: valor em px dividido por 16 dá o valor em rem, se a raiz estiver no padrão.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
