<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">px ignora a preferência de tamanho; rem a respeita</text>

  <rect x="30" y="70" width="410" height="330" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="235" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#c62828">font-size: 24px</text>
  <text x="60" y="150" font-size="24" fill="#222">Texto em px</text>
  <rect x="60" y="180" width="170" height="44" rx="6" fill="#0d47a1"/>
  <text x="145" y="208" text-anchor="middle" font-size="24" fill="#ffffff">Clique aqui</text>
  <text x="235" y="270" text-anchor="middle" font-size="14" fill="#b71c1c">Não muda quando o usuário</text>
  <text x="235" y="292" text-anchor="middle" font-size="14" fill="#b71c1c">aumenta o tamanho padrão do</text>
  <text x="235" y="314" text-anchor="middle" font-size="14" fill="#b71c1c">navegador.</text>
  <text x="235" y="352" text-anchor="middle" font-size="13" fill="#444">O zoom (Ctrl/Cmd + "+") ainda funciona.</text>

  <rect x="460" y="70" width="410" height="330" rx="14" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e7d32">font-size: 1.5rem</text>
  <text x="490" y="150" font-size="24" fill="#222">Texto em rem</text>
  <rect x="490" y="180" width="170" height="44" rx="6" fill="#0d47a1"/>
  <text x="575" y="208" text-anchor="middle" font-size="24" fill="#ffffff">Clique aqui</text>
  <text x="665" y="270" text-anchor="middle" font-size="14" fill="#1b5e20">Acompanha o tamanho padrão</text>
  <text x="665" y="292" text-anchor="middle" font-size="14" fill="#1b5e20">escolhido pelo usuário, porque</text>
  <text x="665" y="314" text-anchor="middle" font-size="14" fill="#1b5e20">1rem = tamanho da raiz (html).</text>
  <text x="665" y="352" text-anchor="middle" font-size="13" fill="#444">Com 16px na raiz, 1.5rem = 24px.</text>

  <text x="450" y="436" text-anchor="middle" font-size="15" fill="#444">A mesma escrita, duas reações diferentes diante da escolha do usuário.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
