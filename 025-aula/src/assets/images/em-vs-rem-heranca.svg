<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">em depende do pai. rem depende sempre da raiz.</text>

  <!-- Árvore -->
  <rect x="30" y="70" width="410" height="340" rx="14" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
  <text x="235" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Hierarquia (exemplo)</text>
  <rect x="70" y="120" width="330" height="54" rx="8" fill="#bbdefb" stroke="#1565c0"/>
  <text x="235" y="144" text-anchor="middle" font-size="15" fill="#0d47a1">html (raiz): 16px</text>
  <text x="235" y="164" text-anchor="middle" font-size="13" fill="#0d47a1">tamanho padrão do navegador</text>
  <line x1="235" y1="174" x2="235" y2="196" stroke="#555" stroke-width="2"/>
  <rect x="90" y="196" width="290" height="54" rx="8" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="235" y="220" text-anchor="middle" font-size="15" fill="#1b5e20">div: font-size 200% = 32px</text>
  <text x="235" y="240" text-anchor="middle" font-size="13" fill="#1b5e20">(pai do parágrafo)</text>
  <line x1="235" y1="250" x2="235" y2="272" stroke="#555" stroke-width="2"/>
  <rect x="110" y="272" width="250" height="54" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="235" y="296" text-anchor="middle" font-size="15" fill="#8d6e00">p (em): 2em = 64px</text>
  <text x="235" y="316" text-anchor="middle" font-size="13" fill="#8d6e00">2 x 32px do pai</text>

  <!-- Comparação -->
  <rect x="460" y="70" width="410" height="340" rx="14" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Mesmo texto, duas unidades</text>
  <rect x="490" y="130" width="350" height="90" rx="8" fill="#fff8e1" stroke="#f9a825"/>
  <text x="505" y="158" font-size="14" font-weight="bold" fill="#8d6e00">Com em (dentro da div de 32px)</text>
  <text x="505" y="186" font-size="22" fill="#222">Parágrafo: 64px</text>
  <rect x="490" y="236" width="350" height="90" rx="8" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="505" y="264" font-size="14" font-weight="bold" fill="#1b5e20">Com rem (2rem)</text>
  <text x="505" y="292" font-size="22" fill="#222">Parágrafo: 32px</text>
  <text x="665" y="352" text-anchor="middle" font-size="14" font-style="italic" fill="#444">Em um sistema com muitos níveis, em se acumula.</text>
  <text x="665" y="374" text-anchor="middle" font-size="14" font-style="italic" fill="#444">rem permanece previsível.</text>

  <text x="450" y="446" text-anchor="middle" font-size="15" fill="#444">Valores de exemplo, para entender a regra. Os valores reais dependem do seu CSS.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
