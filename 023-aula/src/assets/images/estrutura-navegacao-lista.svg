<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">Estrutura de uma navegação em lista</text>

  <!-- Árvore -->
  <rect x="30" y="70" width="400" height="330" rx="14" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
  <text x="230" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Hierarquia do HTML</text>
  <rect x="60" y="120" width="170" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="145" y="144" text-anchor="middle" font-size="15" fill="#1b5e20">&lt;nav aria-label="Principal"&gt;</text>
  <line x1="90" y1="156" x2="90" y2="184" stroke="#555" stroke-width="2"/>
  <rect x="100" y="184" width="130" height="36" rx="6" fill="#bbdefb" stroke="#1565c0"/>
  <text x="165" y="208" text-anchor="middle" font-size="15" fill="#0d47a1">&lt;ul&gt;</text>
  <line x1="130" y1="220" x2="130" y2="248" stroke="#555" stroke-width="2"/>
  <rect x="140" y="248" width="110" height="36" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="195" y="272" text-anchor="middle" font-size="15" fill="#8d6e00">&lt;li&gt;</text>
  <line x1="170" y1="284" x2="170" y2="312" stroke="#555" stroke-width="2"/>
  <rect x="180" y="312" width="110" height="36" rx="6" fill="#f3e5f5" stroke="#8e24aa"/>
  <text x="235" y="336" text-anchor="middle" font-size="15" fill="#6a1b9a">&lt;a href&gt;</text>
  <text x="60" y="376" font-size="13" font-style="italic" fill="#555">Cada li é filho direto da ul.</text>
  <text x="60" y="394" font-size="13" font-style="italic" fill="#555">O link fica dentro do li.</text>

  <!-- Resultado visual -->
  <rect x="460" y="70" width="410" height="330" rx="14" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Como aparece na tela</text>
  <rect x="490" y="130" width="350" height="56" rx="8" fill="#eeeeee"/>
  <text x="515" y="165" font-size="16" fill="#000">Início</text>
  <text x="615" y="165" font-size="16" fill="#000">Produtos</text>
  <text x="755" y="165" font-size="16" fill="#000">Contato</text>
  <text x="665" y="230" text-anchor="middle" font-size="15" fill="#444">Com CSS: links lado a lado,</text>
  <text x="665" y="252" text-anchor="middle" font-size="15" fill="#444">com área de toque ampliada.</text>
  <text x="665" y="290" text-anchor="middle" font-size="15" font-style="italic" fill="#1b5e20">Sem CSS: lista vertical, legível</text>
  <text x="665" y="312" text-anchor="middle" font-size="15" font-style="italic" fill="#1b5e20">e com a hierarquia preservada.</text>

  <text x="450" y="436" text-anchor="middle" font-size="15" fill="#444">A estrutura é a mesma. O CSS decide apenas a aparência.</text>
</svg>
