<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">Por que o link precisa de display: block</text>

  <!-- Inline -->
  <rect x="30" y="70" width="410" height="300" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="235" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#c62828">a como inline (padrão)</text>
  <rect x="60" y="160" width="350" height="60" fill="#f5f5f5" stroke="#bbb" stroke-dasharray="4 4"/>
  <text x="70" y="150" font-size="12" fill="#777">linha de texto</text>
  <rect x="80" y="130" width="180" height="90" rx="4" fill="#b3e5fc" fill-opacity="0.6" stroke="#0288d1" stroke-dasharray="6 4"/>
  <text x="170" y="186" text-anchor="middle" font-size="16" fill="#01579b">Produtos</text>
  <text x="235" y="262" text-anchor="middle" font-size="14" fill="#b71c1c">O padding vertical se estende,</text>
  <text x="235" y="284" text-anchor="middle" font-size="14" fill="#b71c1c">mas não empurra o layout: vaza.</text>
  <text x="235" y="330" text-anchor="middle" font-size="13" fill="#444">Quanto maior o padding, mais invade</text>
  <text x="235" y="350" text-anchor="middle" font-size="13" fill="#444">o espaço ao redor.</text>

  <!-- Block -->
  <rect x="460" y="70" width="410" height="300" rx="14" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e7d32">a como display: block</text>
  <rect x="490" y="120" width="350" height="140" rx="4" fill="#b3e5fc" fill-opacity="0.6" stroke="#0288d1" stroke-dasharray="6 4"/>
  <text x="665" y="194" text-anchor="middle" font-size="16" fill="#01579b">Produtos</text>
  <text x="665" y="222" text-anchor="middle" font-size="12" fill="#333">(padding ocupa o espaço da caixa)</text>
  <text x="665" y="290" text-anchor="middle" font-size="14" fill="#1b5e20">O bloco ocupa seu próprio espaço.</text>
  <text x="665" y="312" text-anchor="middle" font-size="14" fill="#1b5e20">A área de toque cresce sem invadir.</text>
  <text x="665" y="350" text-anchor="middle" font-size="13" fill="#444">inline-block também funciona.</text>

  <text x="450" y="416" text-anchor="middle" font-size="15" fill="#444">Regra: para ampliar a área clicável de um link, dê a ele display: block (ou inline-block).</text>
</svg>
