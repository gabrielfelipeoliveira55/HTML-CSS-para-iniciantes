<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">Navegação com ou sem lista?</text>

  <rect x="30" y="70" width="410" height="300" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="235" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#c62828">Sem lista (nav &gt; a)</text>
  <text x="60" y="140" font-size="15" fill="#222">+ Marcação mais simples</text>
  <text x="60" y="168" font-size="15" fill="#222">+ Menos palavras repetidas</text>
  <text x="60" y="196" font-size="15" fill="#222">+ Alguns usuários preferem</text>
  <text x="60" y="236" font-size="15" fill="#b71c1c">- Sem contagem de itens</text>
  <text x="60" y="264" font-size="15" fill="#b71c1c">- Hierarquia (submenus) é difícil</text>
  <text x="60" y="292" font-size="15" fill="#b71c1c">- Menos comum que a lista</text>
  <text x="235" y="340" text-anchor="middle" font-size="13" font-style="italic" fill="#555">Bom para menus pequenos e simples.</text>

  <rect x="460" y="70" width="410" height="300" rx="14" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e7d32">Com lista (nav &gt; ul &gt; li)</text>
  <text x="490" y="140" font-size="15" fill="#222">+ Anuncia "lista com N itens"</text>
  <text x="490" y="168" font-size="15" fill="#222">+ Hierarquia clara com aninhamento</text>
  <text x="490" y="196" font-size="15" fill="#222">+ Padrão amplamente conhecido</text>
  <text x="490" y="236" font-size="15" fill="#b71c1c">- Anúncios repetidos podem cansar</text>
  <text x="490" y="264" font-size="15" fill="#b71c1c">- Mais marcação para escrever</text>
  <text x="490" y="292" font-size="15" fill="#b71c1c">- Pode variar entre leitores de tela</text>
  <text x="665" y="340" text-anchor="middle" font-size="13" font-style="italic" fill="#555">Recomendado como padrão para navegações.</text>

  <text x="450" y="410" text-anchor="middle" font-size="15" fill="#444">A discussão mostrou que as duas opções têm pontos fortes. A escolha deve considerar o contexto e testes reais.</text>
</svg>
