<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">Os três tipos de lista em HTML</text>

  <!-- ul -->
  <rect x="30" y="70" width="260" height="330" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="160" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">&lt;ul&gt; sem ordem</text>
  <text x="60" y="150" font-size="16" fill="#0d47a1">•</text>
  <text x="80" y="150" font-size="16" fill="#222">O Senhor dos Anéis</text>
  <text x="60" y="182" font-size="16" fill="#0d47a1">•</text>
  <text x="80" y="182" font-size="16" fill="#222">O Hobbit</text>
  <text x="160" y="250" text-anchor="middle" font-size="14" font-style="italic" fill="#0d47a1">A ordem não importa.</text>
  <text x="160" y="272" text-anchor="middle" font-size="14" font-style="italic" fill="#0d47a1">Ex.: lista de filmes.</text>

  <!-- ol -->
  <rect x="320" y="70" width="260" height="330" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="450" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b5e20">&lt;ol&gt; com ordem</text>
  <text x="340" y="150" font-size="16" fill="#1b5e20">1.</text>
  <text x="365" y="150" font-size="16" fill="#222">Maria</text>
  <text x="340" y="182" font-size="16" fill="#1b5e20">2.</text>
  <text x="365" y="182" font-size="16" fill="#222">João</text>
  <text x="340" y="214" font-size="16" fill="#1b5e20">3.</text>
  <text x="365" y="214" font-size="16" fill="#222">Carla</text>
  <text x="450" y="290" text-anchor="middle" font-size="14" font-style="italic" fill="#1b5e20">A posição importa.</text>
  <text x="450" y="312" text-anchor="middle" font-size="14" font-style="italic" fill="#1b5e20">Ex.: classificação final.</text>

  <!-- dl -->
  <rect x="610" y="70" width="260" height="330" rx="14" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="740" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#4a148c">&lt;dl&gt; termo e definição</text>
  <text x="630" y="150" font-size="15" font-weight="bold" fill="#4a148c">Emite certificados?</text>
  <text x="660" y="176" font-size="15" fill="#222">Sim, para todos os cursos.</text>
  <text x="630" y="216" font-size="15" font-weight="bold" fill="#4a148c">Meios de pagamento?</text>
  <text x="660" y="242" font-size="15" fill="#222">Dinheiro e cartão.</text>
  <text x="740" y="290" text-anchor="middle" font-size="14" font-style="italic" fill="#4a148c">dt = termo</text>
  <text x="740" y="312" text-anchor="middle" font-size="14" font-style="italic" fill="#4a148c">dd = descrição do termo</text>

  <text x="450" y="436" text-anchor="middle" font-size="15" fill="#444">Visualmente as três são apenas blocos de texto. O que muda é o significado que o HTML entrega.</text>
</svg>
