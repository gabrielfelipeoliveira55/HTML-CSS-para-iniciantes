<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">A caixa da lista: margin e padding</text>

  <!-- Painel esquerdo: padrão -->
  <rect x="30" y="70" width="410" height="340" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="235" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#c62828">Padrão do navegador</text>
  <rect x="60" y="120" width="350" height="250" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="235" y="138" text-anchor="middle" font-size="13" fill="#e65100">margin (espaço externo)</text>
  <rect x="90" y="160" width="290" height="190" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="235" y="180" text-anchor="middle" font-size="13" fill="#1b5e20">padding (espaço interno)</text>
  <rect x="150" y="200" width="170" height="110" fill="#ffffff" stroke="#1565c0"/>
  <text x="235" y="240" text-anchor="middle" font-size="14" fill="#0d47a1">• O Senhor dos Anéis</text>
  <text x="235" y="268" text-anchor="middle" font-size="14" fill="#0d47a1">• O Hobbit</text>
  <text x="235" y="296" text-anchor="middle" font-size="12" fill="#555">(conteúdo)</text>
  <text x="235" y="395" text-anchor="middle" font-size="14" fill="#c62828">padding-left: 40px (padrão)</text>

  <!-- Painel direito: após reset -->
  <rect x="460" y="70" width="410" height="340" rx="14" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e7d32">Após o reset</text>
  <rect x="490" y="120" width="350" height="250" fill="none" stroke="#ef6c00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="665" y="138" text-anchor="middle" font-size="13" fill="#e65100">margin: 0</text>
  <rect x="490" y="120" width="350" height="250" fill="none"/>
  <rect x="490" y="160" width="350" height="210" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="520" y="200" font-size="14" fill="#0d47a1">• O Senhor dos Anéis</text>
  <text x="520" y="228" font-size="14" fill="#0d47a1">• O Hobbit</text>
  <text x="665" y="395" text-anchor="middle" font-size="14" fill="#2e7d32">margin: 0; padding: 0;</text>

  <text x="450" y="446" text-anchor="middle" font-size="15" fill="#444">Ao zerar, você passa a decidir o espaçamento da lista, e não o navegador.</text>
</svg>
