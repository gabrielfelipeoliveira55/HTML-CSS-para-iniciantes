<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">list-style-position: outside ou inside</text>

  <!-- outside -->
  <rect x="30" y="70" width="410" height="270" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="235" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#0d47a1">outside (padrão)</text>
  <line x1="150" y1="130" x2="150" y2="300" stroke="#1565c0" stroke-dasharray="4 4"/>
  <text x="120" y="158" font-size="22" fill="#0d47a1">•</text>
  <text x="150" y="158" font-size="16" fill="#222">Lista com um texto</text>
  <text x="150" y="182" font-size="16" fill="#222">longo que quebra a</text>
  <text x="150" y="206" font-size="16" fill="#222">linha em mais de uma</text>
  <text x="235" y="262" text-anchor="middle" font-size="14" font-style="italic" fill="#0d47a1">A bolinha fica para fora da caixa de texto.</text>
  <text x="235" y="284" text-anchor="middle" font-size="14" font-style="italic" fill="#0d47a1">O alinhamento segue o texto.</text>

  <!-- inside -->
  <rect x="460" y="70" width="410" height="270" rx="14" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#4a148c">inside</text>
  <line x1="580" y1="130" x2="580" y2="300" stroke="#6a1b9a" stroke-dasharray="4 4"/>
  <text x="580" y="158" font-size="22" fill="#4a148c">•</text>
  <text x="600" y="158" font-size="16" fill="#222">Lista com um texto</text>
  <text x="600" y="182" font-size="16" fill="#222">longo que quebra a</text>
  <text x="600" y="206" font-size="16" fill="#222">linha em mais de uma</text>
  <text x="665" y="262" text-anchor="middle" font-size="14" font-style="italic" fill="#4a148c">A bolinha entra no fluxo do texto.</text>
  <text x="665" y="284" text-anchor="middle" font-size="14" font-style="italic" fill="#4a148c">As linhas seguintes não se alinham ao texto.</text>

  <text x="450" y="370" text-anchor="middle" font-size="15" fill="#444">Para a maioria dos casos, a recomendação é remover o marcador com list-style: none.</text>
</svg>
