<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">E se o CSS não carregar?</text>

  <!-- Painel esquerdo: com semântica -->
  <rect x="30" y="70" width="410" height="340" rx="14" fill="#f7f7f7" stroke="#2e7d32" stroke-width="2"/>
  <text x="235" y="105" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e7d32">Com semântica</text>
  <text x="60" y="150" font-size="28" font-weight="bold" fill="#111">Nossas publicações</text>
  <text x="60" y="200" font-size="21" font-weight="bold" fill="#333">O Senhor dos Anéis</text>
  <text x="60" y="228" font-size="16" fill="#444">Um livro de alta fantasia escrito</text>
  <text x="60" y="252" font-size="16" fill="#444">por J. R. R. Tolkien.</text>
  <text x="60" y="296" font-size="21" font-weight="bold" fill="#333">Harry Potter</text>
  <text x="60" y="324" font-size="16" fill="#444">Uma série de sete romances de</text>
  <text x="60" y="348" font-size="16" fill="#444">fantasia escrita por J. K. Rowling.</text>
  <text x="235" y="382" text-anchor="middle" font-size="15" font-style="italic" fill="#2e7d32">A hierarquia continua visível e fácil de escanear.</text>

  <!-- Painel direito: sem semântica -->
  <rect x="460" y="70" width="410" height="340" rx="14" fill="#f7f7f7" stroke="#c62828" stroke-width="2"/>
  <text x="665" y="105" text-anchor="middle" font-size="19" font-weight="bold" fill="#c62828">Sem semântica</text>
  <text x="490" y="150" font-size="16" fill="#444">Nossas publicações</text>
  <text x="490" y="178" font-size="16" fill="#444">O Senhor dos Anéis é um livro de alta</text>
  <text x="490" y="202" font-size="16" fill="#444">fantasia escrito por J. R. R. Tolkien.</text>
  <text x="490" y="236" font-size="16" fill="#444">Harry Potter é uma série de sete romances</text>
  <text x="490" y="260" font-size="16" fill="#444">de fantasia escrita por J. K. Rowling.</text>
  <text x="665" y="382" text-anchor="middle" font-size="15" font-style="italic" fill="#c62828">Tudo tem o mesmo peso. O usuário precisa ler cada linha.</text>

  <text x="450" y="446" text-anchor="middle" font-size="15" fill="#444">Quando o estilo falha, a tecnologia recebe apenas a estrutura que o HTML oferece.</text>
</svg>
