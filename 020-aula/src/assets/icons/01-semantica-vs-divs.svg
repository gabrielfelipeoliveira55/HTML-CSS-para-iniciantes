<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">Mesma página, duas estruturas</text>

  <!-- Painel esquerdo: semântica -->
  <rect x="30" y="70" width="410" height="420" rx="14" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="235" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">Com semântica</text>

  <rect x="60" y="125" width="350" height="50" rx="8" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="235" y="155" text-anchor="middle" font-size="16" fill="#1b5e20">&lt;header&gt; (topo do site)</text>

  <rect x="60" y="190" width="350" height="50" rx="8" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="235" y="220" text-anchor="middle" font-size="16" fill="#1b5e20">&lt;nav&gt; (menu de navegação)</text>

  <rect x="60" y="255" width="350" height="165" rx="8" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="235" y="282" text-anchor="middle" font-size="16" fill="#1b5e20">&lt;main&gt; (conteúdo principal)</text>
  <rect x="80" y="296" width="310" height="34" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="235" y="318" text-anchor="middle" font-size="14" fill="#1b5e20">&lt;h1&gt; Nossas publicações</text>
  <rect x="80" y="340" width="310" height="34" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="235" y="362" text-anchor="middle" font-size="14" fill="#1b5e20">&lt;h2&gt; O Senhor dos Anéis</text>
  <rect x="80" y="384" width="310" height="28" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="235" y="403" text-anchor="middle" font-size="13" fill="#1b5e20">&lt;p&gt; descrição do livro</text>

  <rect x="60" y="435" width="350" height="36" rx="8" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="235" y="458" text-anchor="middle" font-size="16" fill="#1b5e20">&lt;footer&gt; (rodapé)</text>

  <!-- Painel direito: só divs -->
  <rect x="460" y="70" width="410" height="420" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="665" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#c62828">Só com divs</text>

  <rect x="490" y="125" width="350" height="50" rx="8" fill="#ffcdd2" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="665" y="155" text-anchor="middle" font-size="16" fill="#b71c1c">div (?)</text>

  <rect x="490" y="190" width="350" height="50" rx="8" fill="#ffcdd2" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="665" y="220" text-anchor="middle" font-size="16" fill="#b71c1c">div (?)</text>

  <rect x="490" y="255" width="350" height="165" rx="8" fill="#ffcdd2" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="665" y="282" text-anchor="middle" font-size="16" fill="#b71c1c">div (?)</text>
  <rect x="510" y="296" width="310" height="34" rx="6" fill="#ffffff" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="665" y="318" text-anchor="middle" font-size="14" fill="#b71c1c">div Nossas publicações</text>
  <rect x="510" y="340" width="310" height="34" rx="6" fill="#ffffff" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="665" y="362" text-anchor="middle" font-size="14" fill="#b71c1c">div O Senhor dos Anéis</text>
  <rect x="510" y="384" width="310" height="28" rx="6" fill="#ffffff" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="665" y="403" text-anchor="middle" font-size="13" fill="#b71c1c">div descrição do livro</text>

  <rect x="490" y="435" width="350" height="36" rx="8" fill="#ffcdd2" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="665" y="458" text-anchor="middle" font-size="16" fill="#b71c1c">div (?)</text>

  <text x="450" y="508" text-anchor="middle" font-size="15" fill="#444">Visualmente idênticas. Para o leitor de tela e para o Google, são estruturas muito diferentes.</text>
</svg>
