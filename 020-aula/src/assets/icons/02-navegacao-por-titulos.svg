<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">O que o usuário de leitor de tela ouve</text>

  <!-- Esquerda: com headings -->
  <rect x="30" y="70" width="410" height="330" rx="14" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="235" y="105" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e7d32">Com títulos (h1, h2)</text>
  <text x="60" y="145" font-size="16" fill="#1b5e20">Tecla de navegação por títulos</text>
  <rect x="60" y="160" width="350" height="46" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="75" y="189" font-size="16" fill="#1b5e20">Nível 1: Nossas publicações</text>
  <rect x="60" y="216" width="350" height="46" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="75" y="245" font-size="16" fill="#1b5e20">Nível 2: O Senhor dos Anéis</text>
  <rect x="60" y="272" width="350" height="46" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="75" y="301" font-size="16" fill="#1b5e20">Nível 2: Harry Potter</text>
  <text x="235" y="352" text-anchor="middle" font-size="15" font-style="italic" fill="#1b5e20">Em segundos, o usuário entende o assunto da página.</text>

  <!-- Direita: sem headings -->
  <rect x="460" y="70" width="410" height="330" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="665" y="105" text-anchor="middle" font-size="19" font-weight="bold" fill="#c62828">Sem títulos (só divs)</text>
  <text x="490" y="145" font-size="16" fill="#b71c1c">Tecla de navegação por títulos</text>
  <rect x="490" y="160" width="350" height="46" rx="8" fill="#ffffff" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="505" y="189" font-size="16" fill="#b71c1c">Título não encontrado</text>
  <rect x="490" y="216" width="350" height="46" rx="8" fill="#ffffff" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="505" y="245" font-size="16" fill="#b71c1c">Texto: Conheça nossos livros...</text>
  <rect x="490" y="272" width="350" height="46" rx="8" fill="#ffffff" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="505" y="301" font-size="16" fill="#b71c1c">Texto: O Senhor dos Anéis é...</text>
  <text x="665" y="352" text-anchor="middle" font-size="15" font-style="italic" fill="#b71c1c">Sem atalhos: o usuário precisa ler tudo, linha por linha.</text>

  <text x="450" y="432" text-anchor="middle" font-size="15" fill="#444">Fonte da ilustração: elaborada com base na demonstração da aula de HTML semântico.</text>
</svg>
