<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">O menu de pontos de referência, com e sem nomes</text>

  <!-- Esquerda: sem nomes -->
  <rect x="30" y="70" width="410" height="330" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="235" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#c62828">Sem aria-label</text>
  <rect x="70" y="125" width="330" height="44" rx="8" fill="#ffffff" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="235" y="153" text-anchor="middle" font-size="17" fill="#b71c1c">Navegação</text>
  <rect x="70" y="180" width="330" height="44" rx="8" fill="#ffffff" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="235" y="208" text-anchor="middle" font-size="17" fill="#b71c1c">Navegação</text>
  <rect x="70" y="235" width="330" height="44" rx="8" fill="#ffffff" stroke="#c62828" stroke-dasharray="6 4"/>
  <text x="235" y="263" text-anchor="middle" font-size="17" fill="#b71c1c">Navegação</text>
  <text x="235" y="335" text-anchor="middle" font-size="15" font-style="italic" fill="#b71c1c">Três itens iguais: qual é o principal?</text>

  <!-- Direita: com nomes -->
  <rect x="460" y="70" width="410" height="330" rx="14" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e7d32">Com aria-label</text>
  <rect x="500" y="125" width="330" height="44" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="665" y="153" text-anchor="middle" font-size="17" fill="#1b5e20">Navegação primária</text>
  <rect x="500" y="180" width="330" height="44" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="665" y="208" text-anchor="middle" font-size="17" fill="#1b5e20">Navegação de categorias</text>
  <rect x="500" y="235" width="330" height="44" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="665" y="263" text-anchor="middle" font-size="17" fill="#1b5e20">Links do rodapé</text>
  <text x="665" y="335" text-anchor="middle" font-size="15" font-style="italic" fill="#1b5e20">Cada região tem um nome que explica o papel.</text>

  <text x="450" y="436" text-anchor="middle" font-size="15" fill="#444">O conteúdo visual é o mesmo. Só o nome da região muda, e isso decide se a pessoa sabe onde ir.</text>
</svg>
