<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">article ou section? Pergunte: faz sentido sozinho?</text>

  <!-- Esquerda: article -->
  <rect x="30" y="70" width="410" height="330" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="235" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">&lt;article&gt;</text>
  <rect x="70" y="122" width="330" height="170" rx="10" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="235" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">Post do blog</text>
  <text x="235" y="180" text-anchor="middle" font-size="14" fill="#333">Pode ser copiado para outro site</text>
  <text x="235" y="202" text-anchor="middle" font-size="14" fill="#333">ou para um feed de notícias</text>
  <text x="235" y="224" text-anchor="middle" font-size="14" fill="#333">e continua fazendo sentido.</text>
  <text x="235" y="268" text-anchor="middle" font-size="15" font-style="italic" fill="#0d47a1">Independente, reutilizável</text>
  <text x="235" y="322" text-anchor="middle" font-size="14" fill="#333">Com aria-label, vira região</text>
  <text x="235" y="342" text-anchor="middle" font-size="14" fill="#333">nomeada para o leitor de tela.</text>

  <!-- Direita: section -->
  <rect x="460" y="70" width="410" height="330" rx="14" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#4a148c">&lt;section&gt;</text>
  <rect x="500" y="122" width="330" height="54" rx="10" fill="#ffffff" stroke="#6a1b9a" stroke-width="2"/>
  <text x="665" y="154" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a148c">Parte 1: Introdução</text>
  <rect x="500" y="190" width="330" height="54" rx="10" fill="#ffffff" stroke="#6a1b9a" stroke-width="2"/>
  <text x="665" y="222" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a148c">Parte 2: Exemplos</text>
  <rect x="500" y="258" width="330" height="54" rx="10" fill="#ffffff" stroke="#6a1b9a" stroke-width="2"/>
  <text x="665" y="290" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a148c">Parte 3: Conclusão</text>
  <text x="665" y="340" text-anchor="middle" font-size="15" font-style="italic" fill="#4a148c">Só faz sentido dentro do todo</text>
  <text x="665" y="364" text-anchor="middle" font-size="14" fill="#333">Sem aria-label, não cria região.</text>

  <text x="450" y="440" text-anchor="middle" font-size="15" fill="#444">Regra prática: se o conteúdo pode viver sozinho em outro lugar, use article. Se é parte de um texto maior, use section.</text>
</svg>
