<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">HTML define o significado. CSS define a aparência.</text>

  <rect x="30" y="70" width="410" height="300" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="235" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#c62828">Errado: usar a tag pelo visual</text>
  <text x="60" y="144" font-size="15" fill="#222">&lt;strong&gt; só para deixar negrito</text>
  <text x="60" y="172" font-size="15" fill="#222">&lt;blockquote&gt; só para dar recuo</text>
  <text x="60" y="200" font-size="15" fill="#222">&lt;cite&gt; só para deixar itálico</text>
  <text x="235" y="262" text-anchor="middle" font-size="14" font-style="italic" fill="#b71c1c">O significado se perde.</text>
  <text x="235" y="290" text-anchor="middle" font-size="14" font-style="italic" fill="#b71c1c">Quem lê com tecnologia assistiva</text>
  <text x="235" y="312" text-anchor="middle" font-size="14" font-style="italic" fill="#b71c1c">fica sem a informação.</text>

  <rect x="460" y="70" width="410" height="300" rx="14" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e7d32">Certo: tag pelo significado</text>
  <text x="490" y="144" font-size="15" fill="#222">&lt;strong&gt; para algo importante</text>
  <text x="490" y="172" font-size="15" fill="#222">&lt;blockquote&gt; para citação em bloco</text>
  <text x="490" y="200" font-size="15" fill="#222">&lt;cite&gt; para título de obra</text>
  <text x="665" y="262" text-anchor="middle" font-size="14" font-style="italic" fill="#1b5e20">O CSS cuida do visual, à vontade.</text>
  <text x="665" y="290" text-anchor="middle" font-size="14" font-style="italic" fill="#1b5e20">O significado continua ali</text>
  <text x="665" y="312" text-anchor="middle" font-size="14" font-style="italic" fill="#1b5e20">mesmo se o CSS não carregar.</text>

  <text x="450" y="416" text-anchor="middle" font-size="15" fill="#444">Pergunta-chave antes de escolher uma tag: qual é o papel deste texto na página?</text>
</svg>
