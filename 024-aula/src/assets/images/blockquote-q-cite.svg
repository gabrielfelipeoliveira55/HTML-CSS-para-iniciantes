<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">blockquote e q: citações em bloco e em linha</text>

  <!-- blockquote -->
  <rect x="30" y="70" width="410" height="330" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="235" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#0d47a1">&lt;blockquote&gt; (bloco)</text>
  <rect x="70" y="130" width="6" height="110" fill="#1565c0"/>
  <text x="95" y="160" font-size="16" fill="#222">Se HTML está difícil,</text>
  <text x="95" y="184" font-size="16" fill="#222">nem comece com JavaScript.</text>
  <text x="95" y="222" font-size="14" fill="#555">— texto indentado pelo navegador</text>
  <text x="235" y="290" text-anchor="middle" font-size="14" font-style="italic" fill="#0d47a1">Bloco inteiro, com recuo.</text>
  <text x="235" y="312" text-anchor="middle" font-size="14" fill="#0d47a1">Atributo cite: URL de origem.</text>
  <text x="235" y="342" text-anchor="middle" font-size="14" fill="#333">O autor fica fora, em um parágrafo.</text>

  <!-- q -->
  <rect x="460" y="70" width="410" height="330" rx="14" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#4a148c">&lt;q&gt; (em linha)</text>
  <text x="490" y="160" font-size="16" fill="#222">Como disse alguém, «se HTML</text>
  <text x="490" y="184" font-size="16" fill="#222">está difícil, nem comece com JavaScript»,</text>
  <text x="490" y="208" font-size="16" fill="#222">a frase faz parte do texto.</text>
  <text x="665" y="260" text-anchor="middle" font-size="14" font-style="italic" fill="#4a148c">Citação curta, dentro de uma frase.</text>
  <text x="665" y="282" text-anchor="middle" font-size="14" fill="#4a148c">O navegador coloca as aspas sozinho.</text>
  <text x="665" y="312" text-anchor="middle" font-size="14" fill="#333">Atributo cite: URL de origem.</text>

  <text x="450" y="436" text-anchor="middle" font-size="15" fill="#444">Escolha pelo tamanho da citação: longa e em bloco, curta e dentro do texto.</text>
</svg>
