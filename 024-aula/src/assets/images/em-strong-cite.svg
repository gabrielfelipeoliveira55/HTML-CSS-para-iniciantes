<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">Ênfase, importância e obras: qual usar?</text>

  <rect x="30" y="70" width="270" height="330" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="165" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#8d6e00">&lt;em&gt;</text>
  <text x="165" y="140" text-anchor="middle" font-size="16" fill="#222">Nenhum <tspan font-style="italic">animal</tspan> foi</text>
  <text x="165" y="164" text-anchor="middle" font-size="16" fill="#222">maltratado.</text>
  <text x="165" y="222" text-anchor="middle" font-size="14" fill="#8d6e00">Muda a ênfase da frase.</text>
  <text x="165" y="244" text-anchor="middle" font-size="14" fill="#8d6e00">Ex.: "Eu </text>
  <text x="165" y="266" text-anchor="middle" font-size="14" fill="#8d6e00"><tspan font-style="italic">disse</tspan> que viria."</text>

  <rect x="320" y="70" width="270" height="330" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="455" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#b71c1c">&lt;strong&gt;</text>
  <text x="455" y="140" text-anchor="middle" font-size="16" fill="#222">Atenção: o prazo é</text>
  <text x="455" y="164" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">sexta-feira.</text>
  <text x="455" y="222" text-anchor="middle" font-size="14" fill="#b71c1c">Importância, gravidade ou urgência.</text>
  <text x="455" y="244" text-anchor="middle" font-size="14" fill="#b71c1c">Visualmente, negrito.</text>

  <rect x="610" y="70" width="260" height="330" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="740" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#0d47a1">&lt;cite&gt;</text>
  <text x="740" y="140" text-anchor="middle" font-size="16" fill="#222">Recomendo a leitura de</text>
  <text x="740" y="164" text-anchor="middle" font-size="16" font-style="italic" fill="#222">Dom Casmurro.</text>
  <text x="740" y="222" text-anchor="middle" font-size="14" fill="#0d47a1">Título de obra: livro, filme,</text>
  <text x="740" y="244" text-anchor="middle" font-size="14" fill="#0d47a1">música, quadro.</text>
  <text x="740" y="266" text-anchor="middle" font-size="14" fill="#0d47a1">Não é só para itálico.</text>

  <text x="450" y="436" text-anchor="middle" font-size="15" fill="#444">Para só deixar um trecho em itálico, use CSS, e não as tags acima.</text>
</svg>
