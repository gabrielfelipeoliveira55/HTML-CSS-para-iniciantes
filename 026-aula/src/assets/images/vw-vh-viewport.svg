<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">vw e vh medem a tela. % mede o pai.</text>

  <!-- Viewport -->
  <rect x="30" y="70" width="410" height="330" rx="10" fill="#f5f5f5" stroke="#333" stroke-width="3"/>
  <text x="235" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">viewport (tela visível)</text>
  <rect x="50" y="110" width="200" height="130" fill="#b3e5fc" fill-opacity="0.7" stroke="#0288d1" stroke-dasharray="6 4"/>
  <text x="150" y="180" text-anchor="middle" font-size="15" fill="#01579b">width: 50vw</text>
  <text x="150" y="200" text-anchor="middle" font-size="13" fill="#01579b">metade da tela</text>
  <rect x="270" y="250" width="150" height="130" fill="#c8e6c9" fill-opacity="0.8" stroke="#2e7d32" stroke-dasharray="6 4"/>
  <text x="345" y="318" text-anchor="middle" font-size="15" fill="#1b5e20">height: 100vh</text>
  <text x="345" y="338" text-anchor="middle" font-size="13" fill="#1b5e20">altura total da tela</text>

  <!-- Pai com porcentagem -->
  <rect x="460" y="70" width="410" height="330" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="665" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#8d6e00">section com width: 200px</text>
  <rect x="480" y="150" width="200" height="110" fill="#ffffff" stroke="#8d6e00" stroke-width="2"/>
  <text x="580" y="290" text-anchor="middle" font-size="13" fill="#8d6e00">pai: 200px</text>
  <rect x="480" y="170" width="170" height="60" fill="#ffccbc" fill-opacity="0.8" stroke="#bf360c" stroke-dasharray="6 4"/>
  <text x="565" y="206" text-anchor="middle" font-size="13" fill="#bf360c">width: 50vw</text>
  <text x="665" y="340" text-anchor="middle" font-size="14" fill="#8d6e00">50vw ignora o pai e estoura a caixa.</text>
  <text x="665" y="364" text-anchor="middle" font-size="14" fill="#8d6e00">Com width: 50% (do pai), a caixa cabe.</text>

  <text x="450" y="436" text-anchor="middle" font-size="15" fill="#444">vw e vh dependem da tela. % depende do elemento pai.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
