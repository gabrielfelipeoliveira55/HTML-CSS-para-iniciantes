<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">Por que 100vw pode estourar a tela</text>

  <rect x="30" y="70" width="410" height="330" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="235" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#c62828">Com margin padrão do body</text>
  <rect x="60" y="130" width="350" height="180" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <rect x="68" y="138" width="334" height="164" fill="#ffffff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="235" y="122" text-anchor="middle" font-size="12" fill="#555">margem 8px de cada lado</text>
  <rect x="68" y="150" width="334" height="140" fill="#b3e5fc" fill-opacity="0.8" stroke="#0288d1"/>
  <text x="235" y="222" text-anchor="middle" font-size="15" fill="#01579b">div: 100vw</text>
  <text x="235" y="244" text-anchor="middle" font-size="13" fill="#b71c1c">sobra o total de 16px: estouro</text>
  <text x="235" y="280" text-anchor="middle" font-size="14" fill="#b71c1c">Com scrollbar vertical, a tela também</text>
  <text x="235" y="300" text-anchor="middle" font-size="14" fill="#b71c1c">perde espaço, e o estouro aumenta.</text>

  <rect x="460" y="70" width="410" height="330" rx="14" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e7d32">Com margin: 0 no body</text>
  <rect x="490" y="130" width="350" height="180" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <rect x="490" y="150" width="350" height="140" fill="#b3e5fc" fill-opacity="0.8" stroke="#0288d1"/>
  <text x="665" y="222" text-anchor="middle" font-size="15" fill="#01579b">div: 100vw</text>
  <text x="665" y="244" text-anchor="middle" font-size="13" fill="#1b5e20">ocupa exatamente a tela</text>
  <text x="665" y="280" text-anchor="middle" font-size="14" fill="#1b5e20">Se a página tiver rolagem vertical,</text>
  <text x="665" y="300" text-anchor="middle" font-size="14" fill="#1b5e20">considere 100% do pai como alternativa.</text>

  <text x="450" y="436" text-anchor="middle" font-size="15" fill="#444">Zerar a margem do body evita o estouro causado pelo espaço padrão do navegador.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
