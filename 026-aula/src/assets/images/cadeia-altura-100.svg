<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e1e1e">height: 100% precisa de uma cadeia de pais</text>

  <rect x="30" y="70" width="410" height="330" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="235" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#c62828">Sem altura nos pais</text>
  <rect x="60" y="120" width="350" height="250" fill="#f5f5f5" stroke="#333" stroke-dasharray="6 4"/>
  <text x="235" y="140" text-anchor="middle" font-size="13" fill="#555">html e body: altura automática</text>
  <rect x="80" y="150" width="310" height="60" fill="#b3e5fc" stroke="#0288d1"/>
  <text x="235" y="186" text-anchor="middle" font-size="14" fill="#01579b">div: height 100%</text>
  <text x="235" y="290" text-anchor="middle" font-size="14" fill="#b71c1c">100% de uma altura indefinida:</text>
  <text x="235" y="312" text-anchor="middle" font-size="14" fill="#b71c1c">a div encolhe para o conteúdo.</text>

  <rect x="460" y="70" width="410" height="330" rx="14" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="665" y="104" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e7d32">Com html e body em 100%</text>
  <rect x="490" y="120" width="350" height="250" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="665" y="140" text-anchor="middle" font-size="13" fill="#555">html: height 100%</text>
  <rect x="505" y="150" width="320" height="210" fill="#ffffff" stroke="#777" stroke-dasharray="4 3"/>
  <text x="665" y="168" text-anchor="middle" font-size="13" fill="#555">body: height 100%</text>
  <rect x="520" y="180" width="290" height="170" fill="#b3e5fc" stroke="#0288d1"/>
  <text x="665" y="268" text-anchor="middle" font-size="14" fill="#01579b">div: height 100%</text>
  <text x="665" y="318" text-anchor="middle" font-size="14" fill="#1b5e20">Agora a div ocupa a altura da tela.</text>

  <text x="450" y="436" text-anchor="middle" font-size="15" fill="#444">Alternativa moderna: height: 100vh, sem depender da cadeia de pais.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
